<header class="app-header">
  <div class="header-left">
    <button
      pButton
      type="button"
      class="collapse-btn"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      aria-label="Toggle sidebar"
      (click)="onToggleSidebar()"
    >
      <svg data-p-icon="bars"></svg>
    </button>
    <div class="app-brand">
      <span class="brand-mark"><i class="pi pi-bolt"></i></span>
      <span class="brand-text">FitNexus</span>
    </div>
  </div>

  <div class="header-right">
    @if (notificationStore.enabled()) {
      <app-notification-bell></app-notification-bell>
    }
    <app-theme-toggle></app-theme-toggle>

    <button
      pButton
      type="button"
      class="profile-btn"
      [text]="true"
      (click)="profileMenu.toggle($event)"
      aria-haspopup="true"
    >
      <p-avatar [label]="userInitial" shape="circle" size="normal" />
      <i class="pi pi-angle-down profile-caret"></i>
    </button>
    <p-menu #profileMenu [model]="profileMenuItems" [popup]="true" appendTo="body">
      <ng-template #start>
        <div class="profile-menu-header">
          <p-avatar [label]="userInitial" shape="circle" size="large" />
          <div class="profile-menu-info">
            <span class="profile-menu-email">{{ userEmail }}</span>
            <span class="profile-menu-role">{{ userRoleLabel }}</span>
          </div>
        </div>
      </ng-template>
    </p-menu>
  </div>
</header>

<app-settings-dialog [(visible)]="settingsVisible"></app-settings-dialog>
