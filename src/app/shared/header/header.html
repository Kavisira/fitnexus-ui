<header class="app-header">
  <div class="header-left">
    <button
      pButton
      type="button"
      class="nav-toggle-btn"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      [pTooltip]="(sidebarState.collapsed() ? 'common.expandNav' : 'common.collapseNav') | translate"
      tooltipPosition="bottom"
      aria-label="Toggle navigation"
      (click)="sidebarState.toggleForViewport()"
    >
      <i class="pi pi-bars"></i>
    </button>
  </div>

  <div class="header-title-wrap">
    @if (pageHeader.titleKey(); as key) {
      <span class="header-title">{{ key | translate }}</span>
    }
  </div>

  <div class="header-right">
    <button
      pButton
      type="button"
      class="help-btn"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      [pTooltip]="'common.help' | translate"
      tooltipPosition="bottom"
      aria-label="Help"
      (click)="openHelp()"
    >
      <i class="pi pi-question-circle"></i>
    </button>
    @if (notificationStore.enabled()) {
      <app-notification-bell></app-notification-bell>
    }
    <app-theme-toggle></app-theme-toggle>

    <button
      type="button"
      class="profile-btn"
      aria-label="Profile menu"
      aria-haspopup="true"
      (click)="profileMenu.toggle($event)"
    >
      <p-avatar [label]="userInitial" shape="circle" size="normal" />
    </button>
    <p-menu #profileMenu [model]="profileMenuItems" [popup]="true" appendTo="body" />
  </div>
</header>

<app-org-info-dialog [(visible)]="orgInfoVisible"></app-org-info-dialog>
<app-settings-dialog [(visible)]="settingsVisible"></app-settings-dialog>
<app-version-dialog [(visible)]="versionVisible"></app-version-dialog>
